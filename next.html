
<!DOCTYPE html>
<html>
<head>
    <title>Love</title>

    <style>
        body {
            background-color: pink;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        h1 {
            color: deeppink;
        }

        .heart {
            color: red;
            font-size: 150px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(1);
            }
        }
	.pictures {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px;
        }

        .pictures img {
            width: 180px;
            height: 200px;
            object-fit: cover;
            border: 4px solid white;
            border-radius: 15px;
            box-shadow: 0 4px 10px #d63384;
        }

        button {
            background-color: deeppink;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>your vadhina small gift💕</h1>

    <div class="heart">❤️</div>

    <h2>I Love You! 💖</h2>

    <button onclick="window.location.href='first.html'">
        Love
    </button>
<div class="pictures">
        <img src="pic.jpeg" alt="Our first picture">
    </div>

</body>
</html>
